# Copy this file into your Flutter app's own repo root (e.g. as
# `app_store_suite.yaml`, alongside pubspec.yaml/l10n.yaml) and fill it in for
# your app. Run appstoresuite commands with --config pointing at wherever you
# put it — app-store-suite itself doesn't hold any per-app config.

app:
  name: Fire Message
  flutter_dir: . # relative to this file; "." if the config sits at the repo root
  icon_source: ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png # must be >=1024x1024, relative to flutter_dir

  # Required only for `auto-capture` (unattended, deep-link-driven capture).
  # Omit both this and shots: below to use manual capture-adjacent tooling instead
  # (compose/style-preview/etc. still work fine without them).
  deep_link_scheme: firemessage # yourapp://<route> — must be registered by the app
  # (iOS: CFBundleURLSchemes in Info.plist; Android: an <intent-filter> with
  # android:scheme="yourapp" on the launcher activity), and handled by a debug
  # router that lands on the target screen with sample/mock data already loaded
  # (no login, no live network calls). See README's "Auto-capture requirements".

  # Required only for `fetch-listing` (pulling the currently-live listing copy
  # from App Store Connect / Play Console). Reuse whatever credentials your own
  # Fastfile already uses for shipping — same key files, same IDs. Paths below
  # are relative to flutter_dir.
  bundle_id: com.stanimeros.firemessage
  asc_key_id: D7D3GAJW75
  asc_issuer_id: 2a4793db-567d-4b27-a340-c846b9a75318
  asc_key_path: keys/AuthKey_D7D3GAJW75.p8
  android_package_name: com.stanimeros.firemessage
  play_json_key: keys/stanimeros-dev-fbd9905c1ad6.json

languages:
  - en # first language is the default

# App Store Connect / Play Console locale codes, if they differ from the codes
# above (e.g. "en" here vs "en-US" on the stores). Unmapped languages are tried
# as-is first, then a few common variants.
# store_locales:
#   en: en-US

devices:
  ios_phone:
    simulator: "iPhone 17" # any name from `xcrun simctl list devices available`
  ios_tablet:
    simulator: "iPad Pro 13-inch (M5)"
  android_phone:
    avd: "Medium_Phone" # any AVD name; `appstoresuite setup` creates missing ones
  android_tablet:
    avd: "Pixel_Tablet"

# Optional timing for `auto-capture` (overridable via --warmup-delay / --render-delay).
auto_capture:
  warmup_delay: 10 # after flutter run is ready, before the first deep link
  render_delay: 4  # after each deep link, before screenshotting
  # Xcode 27's DeviceHub can't be scripted to tap the "Open in Fire Message?"
  # sheet that `simctl openurl` shows; deliver routes through a file the debug
  # router polls instead (ScreenshotRouter.startRouteFileWatcher).
  ios_route_file: appstoresuite_route

# Ids carry a numeric prefix because the composer orders the delivered
# screenshots by sorting on `id`, not by the order of this list.
shots:
  - id: 1-create_notification
    route: shot/create_notification
  - id: 2-apps
    route: shot/apps
  - id: 3-targeting
    route: shot/targeting
  - id: 4-history
    route: shot/history
  - id: 5-security
    route: shot/security

style:
  background_color: "#0B0D10" # AppColors.background
  background_mode: "auto" # solid | auto | gradient
  title_color: "#FFFFFF"
  subtitle_color: "#A1A7B0" # AppColors.textSecondary
  text_color_mode: "exact"
  font_bold: "Poppins-Bold.ttf"
  font_regular: "Poppins-Regular.ttf"
  layout: "centered" # centered | tilted
  decoration: "none" # none | shapes | svg
